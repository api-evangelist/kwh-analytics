aid: kwh-analytics
name: kWh Analytics
description: 'kWh Analytics is a Beaverton, Oregon based managing general agent and data-analytics
  firm that underwrites property and performance insurance for renewable energy assets — solar,
  wind, and battery storage. Founded in 2012 and acquired by specialist insurer Beazley in 2023,
  the company operates what it describes as the industry''s largest solar performance database,
  covering roughly 30% of U.S. solar assets across 300,000+ renewable energy assets and $100B+
  in loss data. Its HelioStats platform ingests unstructured asset production documents (via
  AWS S3, Box, Dropbox, email attachment, or API) and applies OCR and machine learning to extract,
  validate, standardize, benchmark, and enrich operating data for investors, lenders, and asset
  owners. Commercial products include data-driven Property Insurance, the Solar Revenue Put
  credit enhancement, the Wind Proxy Hedge, and the SolarScape market intelligence offering.
  kWh Analytics also publishes the annual Solar Risk Assessment industry report. There is no
  public developer portal, published API reference, or machine-readable API specification —
  data delivery and the HelioStats ingest API are arranged through enterprise engagement.'
